{
  "profile": "research",
  "release_gates_profile": "default",
  "training": {
    "output_dir": "outputs_v19",
    "epochs": 100,
    "batch": 64,
    "n_folds": 6,
    "test_size": 0.1,
    "embargo_pct": 0.02,
    "embargo_min_pct": 0.02,
    "embargo_horizon_quantile": 0.95,
    "min_train_pct": 0.2,
    "train_frac": 0.8,
    "min_seq_coverage": 0.8,
    "stage": 0,
    "mode": "event_binary",
    "quality_weight_strong": 2.0,
    "quality_weight_weak": 1.0,
    "sample_weight_mode": "combined",
    "stage1_target": "bias",
    "event_fallback_mode": "directional_rows",
    "require_decision_policy_version": ""
  },
  "refinery": {
    "label_mode": "v19",
    "chunksize": 2000000,
    "chunk_rows": 2000000,
    "n_workers": 32,
    "mbo_workers": 32,
    "mbp_workers": 32,
    "resume": false,
    "shard_warmup_rows": 5000,
    "deterministic_stage1": true,
    "target_bars": 500,
    "label_horizon": 150,
    "event_roll_window": 50,
    "direction_threshold_ticks": 1.5,
    "causal_threshold_mode": "expanding",
    "raw_event_target_rate": 0.9,
    "training_event_target_rate": 0.6,
    "tp_mult": 1.5,
    "sl_mult": 1.0,
    "kalman_slope_threshold": 0.05,
    "trend_strength_min": 0.05,
    "regime_mode": "rules",
    "regime_stride": 50,
    "regime_window": 50,
    "regime_progress_every": 25000,
    "lob_event_sample": 100000,
    "merge_tolerance_ms": 500,
    "step4_min_parallel_rows": 250000,
    "enforce_economic_tp_floor": true,
    "integrity_gates": {
      "enabled": false,
      "block_on_missing_timestamps": true,
      "block_on_duplicate_timestamps": false,
      "block_on_non_monotonic_timestamps": true,
      "block_on_intermediate_non_monotonic_timestamps": false,
      "block_on_nonpositive_prices": true,
      "block_on_negative_sizes": true,
      "block_on_final_timestamp_issues": true,
      "block_on_contract_mismatch": true,
      "max_duplicate_ts_ratio": null,
      "max_merge_lag_ratio": 0.10,
      "max_matched_mbp_lag_ms": 250.0
    }
  },
  "backtest": {
    "tick_size": 0.0001,
    "tick_value": 10.0,
    "round_trip_cost_pips": 1.0,
    "latency_rows": 1,
    "commission_per_side": 5.0,
    "min_spread_ticks": 1.0,
    "min_slippage_ticks": 1.0,
    "spread_multiplier": 0.5,
    "max_daily_loss_pct": 0.02,
    "max_size": 5,
    "starting_equity": 100000.0,
    "allow_in_sample_data_override": false
  },
  "walkforward": {
    "n_splits": 3,
    "initial_train_frac": 0.55,
    "test_frac": 0.15,
    "min_train_rows": 1000
  },
  "logging": {
    "events_file": "events.jsonl",
    "heartbeat_every_rows": 100
  },
  "monitoring": {
    "feature_missing_ratio_max": 0.05,
    "latency_p95_max_ms": 500.0,
    "confidence_mean_delta_max": 0.15,
    "fallback_frequency_max": 0.1,
    "reject_ratio_max": 0.15,
    "data_gap_events_max": 0,
    "psi_proxy_max": 0.25,
    "psi_warn": 0.2,
    "psi_critical": 0.35,
    "event_gate_shift_warn": 0.3,
    "shadow_brier_deterioration_critical": 0.2,
    "shadow_win_rate_drop_critical": 0.1
  },
  "failsafe": {
    "critical_features": [
      "cvd",
      "obi",
      "micro_atr",
      "kyle_lambda",
      "hawkes_intensity",
      "vwap_z_score"
    ],
    "stale_timestamp_seconds": 120,
    "allow_visual_degraded_in_rollout": false,
    "allow_missing_features_in_paper": true,
    "require_shadow_approval_for_rollout": true,
    "shadow_approval_file": "shadow_approval.json",
    "shadow_approval_max_age_days": 14,
    "kill_switch_file": "outputs_v19/kill_switch.flag",
    "manual_override_state": "auto"
  },
  "deeplob": {
    "enabled": true,
    "require_runtime": true
  },
  "shadow": {
    "output_dir": "outputs_v19_shadow",
    "input_scaled": true,
    "min_emitted_predictions": 100,
    "min_realized_outcomes": 100,
    "max_brier_score_delta": 0.2,
    "max_win_rate_drop": 0.1,
    "max_alerts": 0
  },
  "paper": {
    "output_dir": "outputs_v19_paper",
    "base_size": 1,
    "max_size": 5,
    "single_position_only": true,
    "cooldown_rows": 0,
    "allowed_sessions": [],
    "max_spread_pips": 5.0
  },
  "rollout": {
    "enabled": true,
    "max_notional_per_trade": 10000.0,
    "max_contracts": 5,
    "max_open_positions": 1,
    "min_confidence_default": 0.5,
    "min_confidence_by_regime": {
      "Trending": 0.5,
      "Ranging": 0.5,
      "Volatile": 0.5,
      "Low_Liquidity": 0.5
    },
    "max_spread_pips": 3.0,
    "max_latency_ms": 500.0,
    "kill_switch_file": "outputs_v19/kill_switch.flag",
    "manual_override_state": "auto"
  },
  "reproducibility": {
    "enabled": true,
    "seed": 42,
    "enable_deterministic_tf_ops": false,
    "write_seed_manifest": true
  },
  "soft_labels": {
    "enabled": true,
    "mode": "monte_carlo",
    "n_scenarios": 200,
    "horizon_std": 0.30,
    "tp_std": 0.20,
    "sl_std": 0.20,
    "random_seed": 42,
    "strong_quality_boost": 1.3,
    "weak_quality_boost": 1.0,
    "min_sample_weight": 0.1,
    "confidence_weight_power": 1.0,
    "min_confidence_threshold": 0.3,
    "timeout_sigmoid_scale": 1.5,
    "timeout_soft_label_range": 0.4,
    "train_soft_binary_head": true,
    "binary_model_suffix": "_soft_binary"
  }
}
