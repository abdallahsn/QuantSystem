{
  "training": {
    "output_dir": "outputs_v20",
    "epochs": 80,
    "batch": 32,
    "n_folds": 6,
    "test_size": 0.10,
    "embargo_pct": 0.02,
    "train_frac": 0.80,
    "stage": 0,
    "stat_seq_len": 128,
    "lob_seq_len": 128
  },
  "refinery": {
    "label_mode": "v19",
    "chunksize": 0,
    "n_workers": null,
    "target_bars": 500,
    "emit_lob_level_tokens": true
  },
  "stage1": {
    "model": "catboost",
    "store_logits": true,
    "store_leaf_embeddings": true,
    "leaf_emb_dim": 16,
    "store_uncertainty": true
  },
  "stage2": {
    "model": "lob_encoder_v20",
    "levels_per_side": 10,
    "level_feat_dim": 12,
    "snapshot_emb_dim": 48,
    "lob_emb_dim": 32,
    "temporal_model": "dilated_tcn",
    "dilations": [1, 2, 4, 8, 16, 32],
    "use_local_attention": true,
    "attention_window": 32,
    "dropout": 0.10
  },
  "stage3": {
    "model": "fusion_transformer_v20",
    "token_dim": 96,
    "n_layers": 3,
    "n_heads": 4,
    "ff_mult": 4,
    "dropout": 0.10,
    "use_dt_embedding": true,
    "use_confidence_head": true,
    "use_return_head": true
  },
  "backtest": {
    "tick_size": 0.0001,
    "tick_value": 10.0,
    "round_trip_cost_pips": 1.0,
    "max_size": 5,
    "starting_equity": 100000.0
  },
  "walkforward": {
    "n_splits": 3,
    "initial_train_frac": 0.55,
    "test_frac": 0.15,
    "min_train_rows": 1000
  },
  "monitoring": {
    "feature_missing_ratio_max": 0.05,
    "latency_p95_max_ms": 500.0,
    "confidence_mean_delta_max": 0.15,
    "fallback_frequency_max": 0.10,
    "reject_ratio_max": 0.15,
    "data_gap_events_max": 0,
    "psi_proxy_max": 0.25
  }
}
